# Testy przed każdym wdrożeniem: fizyka ćwiczeń (obie sylwetki) i podstawowe funkcje aplikacji (tools/test.sh).
# Strona na GitHub Pages aktualizuje się tylko, gdy wszystkie testy przejdą.
# (Wymaga: Settings → Pages → Source: „GitHub Actions”.)
name: Testy i wdrożenie
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Testy (fizyka + funkcje aplikacji)
        run: tools/test.sh
        env:
          SMOKE_ARGS: slow=3
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # deploy-pages odczytuje artefakt strony przez API Actions
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # GitHub czasem nie widzi świeżo wysłanego artefaktu („No artifacts named github-pages”, znany przejściowy błąd) –
      # ponawiamy wdrożenie dwa razy z odstępem
      - id: d1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.d1.outcome == 'failure'
        run: sleep 45
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 90
      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v5
