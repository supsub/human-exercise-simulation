# Testy przed każdym wdrożeniem: fizyka ćwiczeń (obie sylwetki) i podstawowe funkcje aplikacji (tools/test.sh).
# Strona na GitHub Pages aktualizuje się tylko, gdy wszystkie testy przejdą.
# (Wymaga: Settings → Pages → Source: „GitHub Actions”.)
name: Testy i wdrożenie
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Testy (fizyka + funkcje aplikacji)
        run: tools/test.sh
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
