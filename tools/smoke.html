<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Testy podstawowych funkcji</title>
<style>body{font:14px system-ui;background:#0f141c;color:#e6ebf2;margin:12px}iframe{border:0;width:390px;height:844px;display:block}pre{white-space:pre-wrap}</style></head>
<body>
<pre id="result">trwa…</pre>
<iframe id="app"></iframe>
<script type="module">
// Testy podstawowych funkcji aplikacji (przed każdym wdrożeniem: tools/test.sh).
// Każdy scenariusz: czysta pamięć przeglądarki → aplikacja w ramce (ekran telefonu) → kliknięcia → sprawdzenie.
// Baza: lokalna (localhost; bez działającego `supabase start` – serwer nieosiągalny), więc testy nie dotykają danych produkcyjnych
// i sprawdzają też zachowanie bez sieci. Wynik: „OK – wszystkie testy przeszły” albo lista błędów.
const frame = document.getElementById('app');
const AUTH = 'sb-127-auth-token';
const SLOW = +(new URLSearchParams(location.search).get('slow') ?? 1);   // wolniejsza maszyna (CI): dłuższe limity
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const win = () => frame.contentWindow, doc = () => frame.contentDocument;
const $ = (sel) => doc().querySelector(sel);
const visible = (sel) => { const e = $(sel); return !!e && !e.hidden && e.getClientRects().length > 0; };   // działa też dla position: fixed
let errors = [];
async function waitFor(fn, what, ms = 20000) {   // zimny start (moduły z CDN) bywa wolny
  ms *= SLOW;
  const t0 = performance.now();
  while (performance.now() - t0 < ms) { try { if (await fn()) return; } catch { /* jeszcze nie */ } await sleep(100); }
  let extra = '';
  try { const l = await win().navigator.locks.query(); extra = ` [stan konta: ${$('#auth-open')?.dataset.state}, blokady: ${JSON.stringify(l)}, zapytania: ${(window.__srv?.calls ?? []).join(', ')}]`; } catch { /* brak ramki */ }
  throw new Error(`nie doczekano się: ${what}${extra}`);
}
function check(cond, what) { if (!cond) throw new Error(what); }
// mock: (url, opts, w) => Promise<Response> | undefined – udawany serwer Supabase (src/sync.js używa go w ramce testów)
async function open(setup = () => {}, mock = null) {
  localStorage.clear();
  setup();
  frame.src = 'about:blank'; await sleep(50);
  window.__hesFetch = mock ? (url, opts = {}, w) => mock(String(url?.url ?? url), opts, w) ?? w.fetch(url, opts) : null;
  await new Promise((r) => { frame.onload = r; frame.src = '../index.html'; });
  hook();
  await waitFor(() => $('#plan-days')?.children.length || doc().body.classList.contains('no-plan') || visible('#app-loading'), 'wczytanie aplikacji');
}
// błędy JS w aplikacji, okienka prompt/confirm (nie mogą wyskoczyć same z siebie)
function hook() {
  const w = win();
  w.addEventListener('error', (e) => errors.push(`błąd JS: ${e.message}`));
  w.addEventListener('unhandledrejection', (e) => errors.push(`błąd JS (promise): ${e.reason?.message ?? e.reason}`));
  w.__dialogs = [];
  w.prompt = (m) => { w.__dialogs.push(`prompt: ${m}`); return null; };
  w.confirm = (m) => { w.__dialogs.push(`confirm: ${m}`); return true; };
}
const data = () => JSON.parse(localStorage.getItem('hes.data.v2') ?? 'null');
const fakeSession = (expiresIn) => JSON.stringify({ access_token: 'x.y.z', token_type: 'bearer', expires_in: 3600, expires_at: Math.floor(Date.now() / 1000) + expiresIn,
  refresh_token: 'r', user: { id: '00000000-0000-0000-0000-000000000001', email: 'test@example.com', user_metadata: { full_name: 'Test Testowy' } } });

// kolejność kluczy jak w Postgres jsonb: najpierw krótsze, potem alfabetycznie
const jsonb = (x) => Array.isArray(x) ? x.map(jsonb) : x && typeof x === 'object'
  ? Object.fromEntries(Object.keys(x).sort((a, b) => a.length - b.length || (a < b ? -1 : 1)).map((k) => [k, jsonb(x[k])])) : x;
const canon = (x) => JSON.stringify(x, (k, v) => (v && typeof v === 'object' && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map((key) => [key, v[key]])) : v));
const ACCOUNT = { plans: [{ id: 'p1', name: 'Plan z konta', sessions: 3, variants: ['w1'], days: null }],
  workouts: [{ id: 'w1', name: 'Konto A', items: [{ id: 'squat', sets: 3, reps: 10 }] }] };
// udawany Supabase: wiersz user_data z planem; zapisy (upsert) trafiają do `posts`; wylogowanie na serwerze – błąd 500
function fakeServer() {
  const srv = window.__srv = { row: { data: ACCOUNT, updated_at: 't1' }, posts: [] };
  srv.mock = (url, opts, w) => {
    if (!url.includes('127.0.0.1:54321')) return;
    (srv.calls ??= []).push((opts.method ?? 'GET') + ' ' + url.replace(/^.*54321/, '').slice(0, 60));
    const json = (x, status = 200) => Promise.resolve(new w.Response(JSON.stringify(x), { status, headers: { 'content-type': 'application/json' } }));
    const accept = new w.Headers(opts.headers).get('accept') ?? '';
    const one = (x) => json(accept.includes('vnd.pgrst.object') ? x : [x]);
    if (url.includes('/auth/v1/logout')) return json({ code: 500, msg: 'błąd serwera' }, 500);
    if (url.includes('/rest/v1/user_data')) {
      const method = opts.method ?? 'GET', q = new URL(url).searchParams;
      if (method === 'GET') { if (srv.hideOnce) { srv.hideOnce = false; return json([]); } return srv.row ? one(srv.row) : json(accept.includes('vnd.pgrst.object') ? null : []); }
      const body = JSON.parse(opts.body);
      const write = () => { srv.posts.push(body.data); srv.row = { data: jsonb(body.data), updated_at: 't' + (srv.posts.length + 1) }; return json([{ updated_at: srv.row.updated_at }]); };
      if (method === 'POST' && /merge-duplicates/.test(new w.Headers(opts.headers).get('prefer') ?? '')) return write();   // upsert – nadpisuje jak prawdziwy Supabase
      if (method === 'POST') return srv.row ? json({ code: '23505', message: 'duplicate key' }, 409) : write();      // insert
      if (method === 'PATCH') return srv.row && q.get('updated_at') === `eq.${srv.row.updated_at}` ? write() : json([]);   // update warunkowy
    }
    return Promise.reject(new TypeError('offline'));
  };
  return srv;
}

const tests = {
  'gość: domyślny „Mój plan” z pustym treningiem'() {
    return open().then(async () => {
      await waitFor(() => $('#plan-select')?.selectedOptions[0]?.textContent === 'Mój plan', 'plan „Mój plan”');
      check(doc().body.classList.contains('guest'), 'brak trybu gościa');
      check(visible('#guest-bar'), 'brak paska „Zaloguj się…”');
      await waitFor(() => !visible('#app-loading'), 'zniknięcie ekranu wczytywania u gościa');
      check($('#plan-days .day-card')?.textContent.includes('Trening A'), 'brak „Trening A”');
      check($('#auth-open').textContent.trim() === 'Zaloguj się', 'przycisk konta nie mówi „Zaloguj się”');
    });
  },
  async 'gość: dodanie ćwiczenia zostaje po odświeżeniu'() {
    await open();
    await waitFor(() => $('.add-ex'), 'przycisk „+ Dodaj ćwiczenie”');
    $('.add-ex').click();
    await waitFor(() => $('#picker-list .quick-add'), 'lista ćwiczeń z „+”');
    $('#picker-list .quick-add').click();
    await waitFor(() => data()?.workouts[0]?.items.length === 1, 'ćwiczenie zapisane w treningu');
    await new Promise((r) => { frame.onload = r; win().location.reload(); }); hook();
    await waitFor(() => $('#plan-days .day-card .item') || $('#plan-days [data-ex]'), 'ćwiczenie widoczne po odświeżeniu');
  },
  async 'gość: „+ Nowy” plan prosi o logowanie (bez okienka z nazwą)'() {
    await open();
    await waitFor(() => $('#plan-new'), 'przycisk „+ Nowy”');
    $('#plan-new').click();
    await waitFor(() => visible('#auth-dialog'), 'okienko logowania');
    check(!win().__dialogs.length, `wyskoczyło okienko: ${win().__dialogs.join(', ')}`);
    check(data().plans.length === 1, 'powstał nowy plan bez logowania');
  },
  async 'ustawienia: przełącznik sylwetki Kobieta / Mężczyzna'() {
    await open();
    $('#settings-open').click();
    await waitFor(() => visible('#settings-dialog'), 'okienko ustawień');
    $('#sex-switch [data-sex="f"]').click();
    const scene = await win().eval(`import('${new URL('src/scene.js', doc().baseURI)}')`);   // ten sam moduł, z którego korzysta aplikacja
    check(scene.body.sex === 'f', 'model nie zmienił się na kobietę');
    check(localStorage.getItem('hes.sex') === 'f', 'wybór niezapamiętany');
    check(visible('#settings-dialog'), 'okienko ustawień zamknęło się po wyborze');
    $('#sex-switch [data-sex="m"]').click();
    check(scene.body.sex === 'm', 'model nie wrócił do mężczyzny');
  },
  async 'zapisana sesja: ekran wczytywania, potem bez zawieszenia'() {
    await open(() => localStorage.setItem(AUTH, fakeSession(-100)));   // wygasła – serwer nieosiągalny
    check(visible('#app-loading'), 'brak ekranu wczytywania przy zapisanej sesji');
    await waitFor(() => !visible('#app-loading'), 'zniknięcie ekranu wczytywania', 15000);
  },
  async 'wylogowanie: zawsze kończy się trybem gościa, dane konta znikają'() {
    await open(() => {
      localStorage.setItem(AUTH, fakeSession(3600));
      localStorage.setItem('hes.sync.local', JSON.stringify({ uid: '00000000-0000-0000-0000-000000000001', at: 'x', sent: '' }));
      localStorage.setItem('hes.data.v2', JSON.stringify({ plans: [{ id: 'p1', name: 'Plan z konta', sessions: 3, variants: ['w1'], days: null }],
        workouts: [{ id: 'w1', name: 'Konto A', items: [{ id: 'squat', sets: 3, reps: 10 }] }], currentId: 'p1' }));
    });
    await waitFor(() => $('#auth-open').textContent.includes('Test'), 'zalogowany użytkownik w nagłówku');
    $('#auth-open').click();
    await waitFor(() => visible('#auth-logout'), 'przycisk „Wyloguj”');
    const reloaded = new Promise((r) => (frame.onload = r));
    let shown = false;
    const ld = $('#app-loading');
    const MO = win().MutationObserver;
    new MO(() => { if (!ld.hidden && ld.textContent.includes('Wylogowuję')) shown = true; }).observe(ld, { attributes: true, childList: true, subtree: true });
    $('#auth-logout').click();
    await Promise.race([reloaded, sleep(12000)]); hook();
    check(shown, 'nie było ekranu „Wylogowuję…”');
    await waitFor(() => $('#plan-select')?.selectedOptions[0]?.textContent === 'Mój plan', 'po wylogowaniu „Mój plan” gościa', 10000);
    check(!localStorage.getItem(AUTH), 'sesja została w przeglądarce');
    check(!JSON.stringify(data()).includes('Plan z konta'), 'dane konta zostały w przeglądarce');
    check($('#auth-open').textContent.trim() === 'Zaloguj się', 'nagłówek dalej pokazuje użytkownika');
  },
  async 'wylogowanie z błędem serwera: plany na koncie zostają (nie wysyłamy pustego stanu)'() {
    const srv = fakeServer();
    await open(() => {
      localStorage.setItem(AUTH, fakeSession(3600));
      localStorage.setItem('hes.sync.local', JSON.stringify({ uid: '00000000-0000-0000-0000-000000000001', at: 't1', sent: canon(ACCOUNT) }));
      localStorage.setItem('hes.data.v2', JSON.stringify({ ...ACCOUNT, currentId: 'p1' }));
    }, srv.mock);
    await waitFor(() => $('#auth-open').dataset.state === 'ok', 'synchronizacja z (udawanym) kontem', 25000).catch((e) => { throw new Error(`${e.message} (stan: ${$('#auth-open').dataset.state}, zapytania: ${srv.calls?.join(', ') ?? 'brak'})`); });
    check($('#plan-select').selectedOptions[0]?.textContent === 'Plan z konta', 'nie widać planu z konta');
    $('#auth-open').click();
    await waitFor(() => visible('#auth-logout'), 'przycisk „Wyloguj”');
    const reloaded = new Promise((r) => (frame.onload = r));
    $('#auth-logout').click();
    await Promise.race([reloaded, sleep(12000)]); hook();
    await sleep(3000);   // dawny błąd: pusty stan wysyłał się 1,5 s po wyczyszczeniu
    check(!srv.posts.some((d) => !d.plans?.length), 'na konto wysłano pusty stan – plany zostałyby skasowane');
    check(srv.row.data.plans.length === 1, 'plany na koncie zmienione przy wylogowaniu');
  },
  async 'logowanie: odczyt nie widzi wiersza (wyścig) – plany na koncie nie są nadpisywane'() {
    const srv = fakeServer(); srv.hideOnce = true;
    await open(() => {
      localStorage.setItem(AUTH, fakeSession(3600));
      localStorage.setItem('hes.data.v2', JSON.stringify({ plans: [{ id: 'g1', name: 'Mój plan', sessions: 3, variants: ['gw'], days: null }],
        workouts: [{ id: 'gw', name: 'Trening A', items: [] }], currentId: 'g1' }));   // pusty plan gościa
    }, srv.mock);
    await waitFor(() => ['ok', 'err'].includes($('#auth-open').dataset.state) && !visible('#app-loading'), 'koniec synchronizacji', 15000);
    await sleep(2500);
    check(srv.row.data.plans.some((p) => p.name === 'Plan z konta'), 'plan z konta nadpisany');
    check($('#plan-select').selectedOptions[0]?.textContent === 'Plan z konta', 'po zalogowaniu nie widać planu z konta');
  },
  async 'start zalogowanego: ekran wczytywania, aż widać konto i plany (bez migania „Zaloguj się”)'() {
    const srv = fakeServer();
    let firstPaint = null;
    const watch = setInterval(() => { try { if (doc().getElementById('app-loading') && firstPaint === null && doc().readyState !== 'uninitialized') firstPaint = !doc().getElementById('app-loading').hidden; } catch { /* ramka */ } }, 1);
    await open(() => {
      localStorage.setItem(AUTH, fakeSession(3600));
      localStorage.setItem('hes.sync.local', JSON.stringify({ uid: '00000000-0000-0000-0000-000000000001', at: 't1', sent: canon(ACCOUNT) }));
      localStorage.setItem('hes.data.v2', JSON.stringify({ ...ACCOUNT, currentId: 'p1' }));
    }, srv.mock);
    clearInterval(watch);
    check(firstPaint !== false, 'ekran wczytywania nie był widoczny od początku');
    await waitFor(() => $('#app-loading').classList.contains('fade') || !visible('#app-loading'), 'zniknięcie ekranu wczytywania', 15000);
    check($('#auth-open').textContent.includes('Test'), 'ekran wczytywania zniknął, zanim pokazało się konto');
    check($('#plan-select').selectedOptions[0]?.textContent === 'Plan z konta', 'ekran wczytywania zniknął przed planami z konta');
  },
  async 'sylwetka z konta: ustawienie przychodzi z konta i zmiana trafia na konto, bez odsyłania w kółko'() {
    const srv = fakeServer();
    srv.row = { data: jsonb({ ...ACCOUNT, settings: { sex: 'f' } }), updated_at: 't1' };
    await open(() => {
      localStorage.setItem(AUTH, fakeSession(3600));
      localStorage.setItem('hes.data.v2', JSON.stringify({ ...ACCOUNT, currentId: 'p1' }));
    }, srv.mock);
    await waitFor(() => $('#auth-open').dataset.state === 'ok', 'synchronizacja', 25000);
    const scene = await win().eval(`import('${new URL('src/scene.js', doc().baseURI)}')`);
    check(scene.body.sex === 'f', 'sylwetka z konta (kobieta) nie została ustawiona');
    check($('#sex-switch [data-sex="f"]').getAttribute('aria-checked') === 'true', 'przełącznik w ⚙ nie pokazuje sylwetki z konta');
    await sleep(2500);
    const before = srv.posts.length;
    $('#sex-switch [data-sex="m"]').click();
    await waitFor(() => srv.row.data.settings?.sex === 'm', 'zmiana sylwetki zapisana na koncie');
    await sleep(4000);
    check(srv.posts.length === before + 1, `po jednej zmianie ${srv.posts.length - before} zapisów na koncie (odsyłanie w kółko?)`);
    // zmiana z innego urządzenia, potem kilka pobrań (powrót do aplikacji) – to urządzenie nie może jej odsyłać
    srv.row = { data: jsonb({ ...srv.row.data, settings: { sex: 'f' } }), updated_at: 't99' };
    const n = srv.posts.length, vis = () => doc().dispatchEvent(new (win().Event)('visibilitychange'));
    vis(); await waitFor(() => scene.body.sex === 'f', 'zmiana z innego urządzenia');
    await sleep(2500); vis(); await sleep(2500); vis(); await sleep(2500);
    check(srv.posts.length === n, `po pobraniu zmiany z innego urządzenia ${srv.posts.length - n} zbędnych zapisów (odsyłanie w kółko)`);
  },
  async 'zapis zmian: aktualizuje znaną wersję konta'() {
    const srv = fakeServer();
    await open(() => {
      localStorage.setItem(AUTH, fakeSession(3600));
      localStorage.setItem('hes.sync.local', JSON.stringify({ uid: '00000000-0000-0000-0000-000000000001', at: 't1', sent: canon(ACCOUNT) }));
      localStorage.setItem('hes.data.v2', JSON.stringify({ ...ACCOUNT, currentId: 'p1' }));
    }, srv.mock);
    await waitFor(() => $('#auth-open').dataset.state === 'ok', 'synchronizacja', 25000);
    $('.add-ex').click();
    await waitFor(() => $('#picker-list .quick-add'), 'lista ćwiczeń');
    $('#picker-list .quick-add').click();
    await waitFor(() => srv.row.data.workouts[0].items.length === 2, 'zmiana zapisana na koncie', 8000)
      .catch(async (e) => { const l = await win().navigator.locks.query(); throw new Error(`${e.message} (stan: ${$('#auth-open').dataset.state}, lokalnie: ${data()?.workouts[0]?.items.length} ćw., zapytania: ${srv.calls?.join(', ')}, blokady: ${JSON.stringify(l)})`); });
    check($('#auth-open').dataset.state === 'ok', 'stan po zapisie inny niż „Zapisane”');
  },
};

const out = [];
const only = new URLSearchParams(location.search).get('only');   // ?only=fragment nazwy – tylko wybrane scenariusze
for (const [name, fn] of Object.entries(tests)) {
  if (only && !name.includes(only)) continue;
  errors = [];
  try { await fn(); if (errors.length) throw new Error(errors.join('; ')); out.push(`✔ ${name}`); }
  catch (e) { out.push(`✘ ${name}: ${e.message}`); }
}
localStorage.clear();
const failed = out.filter((l) => l.startsWith('✘'));
document.getElementById('result').textContent = (failed.length ? `BŁĘDY: ${failed.length}` : 'OK – wszystkie testy przeszły') + '\n' + out.join('\n');
</script>
</body></html>
