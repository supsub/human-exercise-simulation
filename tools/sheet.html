<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Arkusz animacji – wszystkie ćwiczenia</title>
  <!-- Narzędzie deweloperskie: wszystkie animacje w pozycji startowej (A) i końcowej (B) na jednej stronie.
       Otwórz: http://localhost:8000/tools/sheet.html  (opcjonalnie ?only=bench,row, ?mistakes – typowe błędy) -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    body { margin: 0; background: #0f141c; color: #e6ebf2; font: 12px system-ui, sans-serif; }
    #grid { position: relative; }
    canvas { display: block; }
    .lbl { position: absolute; padding: 3px 6px; background: rgba(0,0,0,.55); border-radius: 0 0 6px 0; }
  </style>
</head>
<body>
  <div id="grid"><canvas id="c"></canvas></div>
  <script type="module">
    import * as THREE from 'three';
    import { createBody } from '../src/body.js';
    import { EXERCISES } from '../src/exercises/index.js';
    import { sampleExercise } from '../src/exercises/common.js';
    import * as physics from '../src/physics.js';
    import * as grips from '../src/exercises/grips.js';

    const only = new URLSearchParams(location.search).get('only')?.split(',');
    // &part=k/n – tylko co n-te ćwiczenie od k (test fizyki liczony równolegle w kilku przeglądarkach: tools/test.sh)
    const [pk, pn] = (new URLSearchParams(location.search).get('part') ?? '0/1').split('/').map(Number);
    const list = EXERCISES.filter((e) => !only || only.includes(e.id)).filter((e, i) => i % pn === pk);
    const q = new URLSearchParams(location.search);
    const W = +(q.get('w') ?? 240), H = +(q.get('h') ?? 210), COLS = +(q.get('cols') ?? 8);
    // ?mistakes – zamiast pozycji A/B: każdy typowy błąd w punkcie B
    const showMistakes = q.has('mistakes');
    // &ts=0,0.25,0.5 – własne chwile cyklu (zamiast A/B)
    const TS = q.get('ts')?.split(',').map(Number);
    const cells = showMistakes ? list.flatMap((ex) => ex.mistakes.map((m) => [ex, 1, m]))
      : TS ? list.flatMap((ex) => TS.map((t) => [ex, t, ex.mistakes.find((m) => m.id === q.get('mistake'))]))   // &mistake=id – błąd w kolejnych chwilach
      : list.flatMap((ex) => [[ex, 0], [ex, 1]]);
    const rows = Math.ceil(cells.length / COLS);
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(W * COLS, H * rows);
    renderer.setScissorTest(true);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f141c);
    scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a1f28, 1.3));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0); sun.position.set(2.5, 4.5, 3); scene.add(sun);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: 0x1b2230 }));
    floor.rotation.x = -Math.PI / 2; scene.add(floor);
    scene.add(new THREE.GridHelper(6, 24, 0x2c3648, 0x222a38));
    const body = createBody();
    scene.add(body.root);
    // ?check – test fizyki (src/physics.js) dla każdego ćwiczenia i każdego błędu, 60 chwil cyklu
    if (q.has('check')) {
      const { checkPose, checkScenery, checkRanges, checkRest, handOrientation } = physics;
      const { gripMismatch } = grips;
      const out = [];
      for (const ex of list) {
        // chwyt zgodny ze specyfikacją (grips.js) w pozycji wyjściowej
        body.setPose(body.resolvePose(ex.pose(sampleExercise(ex, 0.01).depth, { cycleT: 0.01 })));
        const gm = gripMismatch(ex.id, handOrientation(body, 'L'));
        if (gm) out.push(`${ex.id} chwyt: ${gm}`);
        let railRef = null;
        const okPts = [];   // punkty ciała w poprawnej technice (do porównania z błędami)   // odległość płyty od prowadnicy w pozycji wyjściowej poprawnej techniki
        const variants = [{ id: 'ok', params: {} }, ...ex.mistakes.map((m) => ({ id: m.id, params: m.params }))];
        for (const v of variants) {
          const found = new Map();
          const thumbs = new Set(), widths = [];
          let maxMove = 0;
          for (let i = 0; i < 60; i++) {
            const t = i / 60;
            const pose = body.resolvePose(ex.pose(sampleExercise(ex, t, v.params.rom ?? 0).depth, { ...v.params, cycleT: t }));
            body.setPose(pose);
            // chwyt na drążku: stały typ (kciuki do środka / na zewnątrz) i stały rozstaw dłoni
            const bar = pose.props?.bar;
            if (bar && bar.on !== 'front') {
              const hL = body.points.handL.getWorldPosition(new THREE.Vector3()), hR = body.points.handR.getWorldPosition(new THREE.Vector3());
              const e = body.joints.wristL.matrixWorld.elements;
              thumbs.add(Math.sign(new THREE.Vector3(e[0], e[1], e[2]).dot(hR.clone().sub(hL))));
              if (bar.len !== 'fit') widths.push(hL.distanceTo(hR));
            }
            // zwis (ex.hang): stopy cały czas w powietrzu, co najmniej 10 cm nad podłogą
            const hangIssues = [];
            if (ex.hang) for (const n of ['toeL', 'toeR', 'heelL', 'heelR']) {
              const y = body.points[n].getWorldPosition(new THREE.Vector3()).y;
              if (y < 0.1) hangIssues.push({ what: 'w zwisie stopy dotykają podłogi', part: n, depth: 0.1 - y });
            }
            // platforma suwnicy jeździ po prowadnicach (scenery cyl z rail: true) – stała odległość środka płyty od osi prowadnicy
            const railIssues = [];
            const rail = ex.scenery?.find((d) => d.rail);
            if (rail && pose.props?.plate && body.plateShape?.c) {
              const a = new THREE.Vector3(...rail.cyl[0]), b = new THREE.Vector3(...rail.cyl[1]), c = body.plateShape.c.clone();
              c.x = a.x;   // odległość w płaszczyźnie prowadnicy (y–z)
              const ab = b.clone().sub(a).normalize(), dist = c.clone().sub(a).sub(ab.clone().multiplyScalar(c.clone().sub(a).dot(ab))).length();
              railRef ??= dist;
              if (Math.abs(dist - railRef) > 0.02) railIssues.push({ what: 'platforma suwnicy zjeżdża z prowadnic', part: 'plate', depth: Math.abs(dist - railRef) });
            }
            // błąd musi być widoczny: porównujemy położenie punktów ciała z poprawną techniką w tej samej chwili
            const P = Object.fromEntries([...Object.entries(body.points), ...Object.entries(body.joints)].map(([n, o]) => [n, o.getWorldPosition(new THREE.Vector3())]));   // punkty + stawy (łokcie, kolana)
            if (v.id === 'ok') okPts[i] = P;
            else for (const n in P) if (okPts[i]?.[n]) maxMove = Math.max(maxMove, P[n].distanceTo(okPts[i][n]));
            for (const is of [...checkPose(body, pose), ...checkScenery(body, ex.scenery, pose), ...checkRanges(pose), ...hangIssues, ...railIssues,
              ...(v.id === 'ok' ? checkRest(body, ex.scenery) : [])]) {
              const prev = found.get(is.what);
              if (!prev || is.depth > prev.depth) found.set(is.what, { ...is, t });
            }
          }
          if (v.id !== 'ok' && maxMove < 0.04) out.push(`${ex.id} [${v.id}] błąd prawie niewidoczny – ciało różni się od poprawnej techniki najwyżej o ${(maxMove * 100).toFixed(1)} cm`);
          if (thumbs.size > 1) out.push(`${ex.id} [${v.id}] chwyt zmienia się w trakcie ruchu (nachwyt ↔ podchwyt)`);
          if (widths.length && Math.max(...widths) - Math.min(...widths) > 0.01) out.push(`${ex.id} [${v.id}] dłonie przesuwają się po drążku: ${((Math.max(...widths) - Math.min(...widths)) * 100).toFixed(1)} cm`);
          for (const is of found.values()) out.push(`${ex.id} [${v.id}] ${is.what}: ${is.deg ? `+${is.depth.toFixed(0)}° ponad zakres` : `${(is.depth * 100).toFixed(1)} cm`} (t=${is.t.toFixed(2)})`);
        }
      }
      const pre = document.createElement('pre'); pre.id = 'check';
      pre.textContent = out.length ? out.join('\n') : 'OK – brak naruszeń fizyki';
      document.body.prepend(pre);
    }
    // ?grips – tabela chwytu: wnętrze dłoni / kciuk (lewa ręka) na początku (A) i w punkcie B
    if (q.has('grips')) {
      const { handOrientation } = await import('../src/physics.js');
      const { gripMismatch } = await import('../src/exercises/grips.js');
      const rows = [];
      for (const ex of list) {
        const cell = (t) => {
          body.setPose(body.resolvePose(ex.pose(sampleExercise(ex, t).depth, { cycleT: t })));
          const L = handOrientation(body, 'L'), R = handOrientation(body, 'R');
          return `${L.palm.label}/${L.thumb.label}` + (L.palm.label !== R.palm.label || L.thumb.label !== R.thumb.label ? ` (P: ${R.palm.label}/${R.thumb.label})` : '') + (t < 0.05 && gripMismatch(ex.id, L) ? '  ✗ ' + gripMismatch(ex.id, L) : '');
        };
        rows.push(`${ex.id.padEnd(18)} B: ${cell((ex.phases[1]?.end ?? 0.5) - 0.01).padEnd(26)} A: ${cell(0.01)}`);
      }
      const pre = document.createElement('pre'); pre.id = 'grips'; pre.textContent = rows.join('\n');
      document.body.prepend(pre);
    }
    const scenery = new THREE.Group(); scene.add(scenery);
    const COLORS = { pad: 0x343b48, frame: 0x5d6572, metal: 0x9aa1ab, wall: 0x232a36 };
    function setScenery(defs = []) {
      scenery.clear();
      for (const d of defs) {
        const mat = new THREE.MeshStandardMaterial({ color: COLORS[d.color ?? (d.box ? 'pad' : 'metal')] });
        let m;
        if (d.box) { m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat); m.position.set(...d.box); m.scale.set(...d.size); m.rotation.x = d.rx ?? 0; }
        else {
          const a = new THREE.Vector3(...d.cyl[0]), b = new THREE.Vector3(...d.cyl[1]);
          m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 12), mat);
          m.position.copy(a).add(b).multiplyScalar(0.5); m.scale.set(d.r ?? 0.02, a.distanceTo(b), d.r ?? 0.02);
          m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
        }
        scenery.add(m);
      }
    }
    const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 50);
    const grid = document.getElementById('grid');
    if (!q.has('check')) cells.forEach(([ex, which, mistake], i) => {   // test fizyki: bez rysowania arkusza
      const cx = (i % COLS) * W, cy = Math.floor(i / COLS) * H;
      // A = pozycja na początku cyklu, B = najgłębszy / najwyższy punkt (koniec drugiej fazy)
      const t = TS ? which : which === 0 ? 0.01 : (ex.phases[1]?.end ?? 0.5) - 0.01;
      const prm = mistake ? mistake.params : {};
      const pose = body.resolvePose(ex.pose(sampleExercise(ex, t, prm.rom ?? 0).depth, { ...prm, cycleT: t }));
      body.setPose(pose);
      body.setBreath(0.4);
      setScenery(ex.scenery);
      // ?cam=x,y,z&target=x,y,z – własna kamera (np. zbliżenie na dłonie)
      let tg = new THREE.Vector3(...(q.get('target')?.split(',').map(Number) ?? ex.cameraTarget ?? [0, 0.85, 0]));
      let pos = q.get('cam') ? new THREE.Vector3(...q.get('cam').split(',').map(Number))
        : new THREE.Vector3(...ex.cameraPosition).sub(tg).multiplyScalar(1.15).add(tg);
      // &focus=hands|handL|feet – zbliżenie (kierunek kamery jak w ćwiczeniu, &dist – odległość)
      const focus = q.get('focus');
      if (focus) {
        const P = (n) => body.points[n].getWorldPosition(new THREE.Vector3());
        const f = focus === 'hands' ? P('handL').add(P('handR')).multiplyScalar(0.5) : focus === 'feet' ? P('heelL').add(P('toeL')).multiplyScalar(0.5) : P(focus);
        const dir = pos.clone().sub(tg).normalize();
        if (q.has('dir')) dir.set(...q.get('dir').split(',').map(Number)).normalize();
        tg = f; pos = f.clone().addScaledVector(dir, +(q.get('dist') ?? 0.7));
      }
      camera.position.copy(pos); camera.lookAt(tg);
      const y = H * rows - cy - H;
      renderer.setViewport(cx, y, W, H); renderer.setScissor(cx, y, W, H);
      renderer.render(scene, camera);
      const l = document.createElement('div');
      l.className = 'lbl'; l.style.left = cx + 'px'; l.style.top = cy + 'px';
      l.textContent = mistake && TS ? `${ex.id}: ${mistake.name} t=${which}` : mistake ? `${ex.id}: ${mistake.name}` : TS ? `${ex.id} t=${which}` : `${ex.id} ${which ? 'B' : 'A'}`;
      grid.appendChild(l);
    });
  </script>
</body>
</html>
